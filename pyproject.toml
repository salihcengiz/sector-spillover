[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spillover"
version = "0.1.0"
description = "Fama–French 49 sektör getirilerinde şok yayılımı ve ileri risk tahmini (bitirme projesi)"
requires-python = ">=3.9"
# Bağımlılıklar requirements.txt dosyasında tutulur.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
